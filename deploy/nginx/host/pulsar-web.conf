# Host nginx — pulsar.antimony.com.ng (dashboard)
# Install: sudo cp deploy/nginx/host/pulsar-web.conf /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/pulsar-web.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name pulsar.antimony.com.ng;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
