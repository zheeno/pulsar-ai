# Host nginx — pulsar-api.antimony.com.ng (API)
# CORS is handled by the NestJS API (CORS_ORIGIN env). Nginx is a plain reverse proxy.

server {
    listen 80;
    server_name pulsar-api.antimony.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pulsar-api.antimony.com.ng;

    ssl_certificate     /etc/letsencrypt/live/pulsar.antimony.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsar.antimony.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3954;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
