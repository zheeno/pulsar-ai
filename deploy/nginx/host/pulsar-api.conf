# Host nginx — pulsar-api.antimony.com.ng (API)
# Requires /etc/nginx/conf.d/pulsar-cors-map.conf

server {
    listen 80;
    server_name pulsar-api.antimony.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pulsar-api.antimony.com.ng;

    ssl_certificate     /etc/letsencrypt/live/pulsar.antimony.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsar.antimony.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $pulsar_cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3954;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin $pulsar_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }
}
