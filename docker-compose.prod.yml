services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pulsar

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3954}:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://pulsar.antimony.com.ng}
      WEB_DOMAIN: ${WEB_DOMAIN:-pulsar.antimony.com.ng}
      API_PORT: "3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pulsar

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://pulsar-api.antimony.com.ng/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3955}:3000"
    environment:
      PORT: "3000"
    depends_on:
      - api
    networks:
      - pulsar

networks:
  pulsar:
    driver: bridge
