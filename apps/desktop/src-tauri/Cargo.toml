[package]
name = "pulsar-desktop"
version = "1.0.0"
description = "Pulsar AI - Local NGX Trading Assistant"
authors = ["Pulsar AI"]
edition = "2021"

[lib]
name = "pulsar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
anyhow = "1"
dotenvy = "0.15"
parking_lot = "0.12"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"
sha2 = "0.10"
regex = "1"
percent-encoding = "2"

# macOS 11 dev: objc2 debug_assert panics when wry registers WKUIDelegate methods
# that WebKit only added in macOS 12+ (see tauri-apps/tauri#11496).
[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
