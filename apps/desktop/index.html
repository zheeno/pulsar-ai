<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsar AI</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0b1220; color: #f8fafc; }
      #native-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background:
          radial-gradient(900px 520px at 50% 42%, rgba(56, 189, 248, 0.1), transparent 58%),
          #0b1220;
        color: #e2e8f0;
        font: 15px/1.4 system-ui, -apple-system, sans-serif;
      }
      #native-splash[hidden] { display: none !important; }
      #native-splash .mark { width: 88px; height: 88px; }
      #native-splash .wordmark {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #f8fafc;
      }
      #native-splash .wordmark span { color: #38bdf8; font-weight: 600; }
      #native-splash [data-boot-msg] { margin: 0; opacity: 0.85; letter-spacing: 0.02em; }
      #boot-error {
        display: none;
        box-sizing: border-box;
        min-height: 100vh;
        padding: 2rem;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #boot-error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div id="native-splash" role="status" aria-live="polite">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pulsar AI">
        <defs>
          <linearGradient id="native-pulsar-core" x1="18" y1="14" x2="48" y2="52" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7dd3fc"/>
            <stop offset="55%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
          </linearGradient>
          <linearGradient id="native-pulsar-wave" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
            <stop offset="35%" stop-color="#22c55e"/>
            <stop offset="70%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
          </linearGradient>
          <radialGradient id="native-pulsar-glow" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
            <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="#0f172a"/>
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-opacity="0.9"/>
        <circle cx="32" cy="32" r="22" fill="url(#native-pulsar-glow)"/>
        <circle cx="32" cy="32" r="20" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.25"/>
        <circle cx="32" cy="32" r="14.5" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.35"/>
        <circle cx="32" cy="32" r="9" fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="1.4"/>
        <path
          d="M11 36.5 C15 36.5 16.5 34 18.5 30.5 C20.8 26.2 22.2 20 25.2 20 C28.4 20 29.2 28.5 32 32 C34.6 35.2 36.1 42.5 39.2 42.5 C42.2 42.5 43.6 34.8 46.2 30.2 C48.4 26.4 50.2 27.5 53 27.5"
          fill="none"
          stroke="url(#native-pulsar-wave)"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="32" cy="32" r="4.2" fill="url(#native-pulsar-core)"/>
        <circle cx="32" cy="32" r="1.7" fill="#f8fafc"/>
      </svg>
      <p class="wordmark">Pulsar <span>AI</span></p>
      <p data-boot-msg>Starting Pulsar…</p>
    </div>
    <div id="boot-error" role="alert"></div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.getAttribute('data-js-booted') === '1') return;
        var splash = document.getElementById('native-splash');
        if (!splash || splash.hasAttribute('hidden')) return;
        var msg = splash.querySelector('[data-boot-msg]');
        if (msg) {
          msg.textContent =
            'The interface did not load. Quit Pulsar AI and open it again. If this persists, rebuild the desktop app.';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
